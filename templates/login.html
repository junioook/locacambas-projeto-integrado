{% extends "base.html" %}
{% block titulo %}Login{% endblock %}
{% block classe_main %}tela-login{% endblock %}
{% block conteudo %}
<form method="post" class="cartao login">
  <img class="logo-grande" src="{{ url_for('static', filename='logo.png') }}" alt="Locaçambas">
  <div class="abas"><span>Login</span></div>
  <input name="login" placeholder="Usuário" autofocus required>
  <input name="senha" type="password" placeholder="Senha" required style="margin-top:14px">
  <button type="submit">Entrar</button>
  <p class="rodape">Acesso restrito aos atendentes</p>
</form>
{% endblock %}
